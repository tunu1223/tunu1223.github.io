<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個体値カリキュレーター - つぬつーるず</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="wrapper">
    <div class="input-panel">
      <table class="input-table">
        <tbody>
          <tr>
            <td class="form-label">ポケモン:</td>
            <td colspan="3"><select id="pokemon"></select></td>
          </tr>
          <tr>
            <td class="form-label">性格:</td>
            <td><select id="nature"></select></td>
            <td class="form-label">個性:</td>
            <td><select id="kosei"></select></td>
          </tr>
          <tr>
            <td class="form-label">めざパ:</td>
            <td><select id="mezapa"></select></td>
            <td class="form-label">合計:</td>
            <td><select id="judge_total"></select></td>
          </tr>
          <tr>
            <td class="form-label">レベル:</td>
            <td colspan="3">
              <input id="level" type="number" max="100" min="1" value="1" tabindex="5">
              <input type="button" data-target="level" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="level" data-val="-1" value="▼" class="num_ctrl">
              <input type="button" data-target="level" data-val="1" value="1" class="num_input">
              <input type="button" data-target="level" data-val="50" value="50" class="num_input">
              <input type="button" data-target="level" data-val="100" value="100" class="num_input">
            </td>
            <td class="form-label">努力値合計:</td>
            <td><div id="effort_total">0</div></td>
          </tr>

          <tr>
            <td class="form-label">HP:</td>
            <td>
              <input type="number" id="stats_h" value="1" max="999" min="1" tabindex="6">
              <input type="button" data-target="stats_h" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="stats_h" data-val="-1" value="▼" class="num_ctrl">
            </td>
            <td class="form-label">努力値:</td>
            <td>
              <input type="number" id="effort_h" value="0" max="255" min="0" class="effort_input">
              <input type="button" data-target="effort_h" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="effort_h" data-val="-1" value="▼" class="num_ctrl">
              <input type="button" data-target="effort_h" data-val="0" value="0" class="num_input num_input_min">
              <input type="button" data-target="effort_h" data-val="252" value="252" class="num_input num_input_max">
            </td>
            <td class="form-label">ジャッジ:</td>
            <td><select id="judge_h"></select></td>
          </tr>

          <tr>
            <td class="form-label">攻撃:</td>
            <td>
              <input type="number" id="stats_a" value="1" max="999" min="1" tabindex="6">
              <input type="button" data-target="stats_a" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="stats_a" data-val="-1" value="▼" class="num_ctrl">
            </td>
            <td class="form-label">努力値:</td>
            <td>
              <input type="number" id="effort_a" value="0" max="255" min="0" class="effort_input">
              <input type="button" data-target="effort_a" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="effort_a" data-val="-1" value="▼" class="num_ctrl">
              <input type="button" data-target="effort_a" data-val="0" value="0" class="num_input num_input_min">
              <input type="button" data-target="effort_a" data-val="252" value="252" class="num_input num_input_max">
            </td>
            <td class="form-label">ジャッジ:</td>
            <td><select id="judge_a"></select></td>
          </tr>

          <tr>
            <td class="form-label">防御:</td>
            <td>
              <input type="number" id="stats_b" value="1" max="999" min="1" tabindex="6">
              <input type="button" data-target="stats_b" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="stats_b" data-val="-1" value="▼" class="num_ctrl">
            </td>
            <td class="form-label">努力値:</td>
            <td>
              <input type="number" id="effort_b" value="0" max="255" min="0" class="effort_input">
              <input type="button" data-target="effort_b" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="effort_b" data-val="-1" value="▼" class="num_ctrl">
              <input type="button" data-target="effort_b" data-val="0" value="0" class="num_input num_input_min">
              <input type="button" data-target="effort_b" data-val="252" value="252" class="num_input num_input_max">
            </td>
            <td class="form-label">ジャッジ:</td>
            <td><select id="judge_b"></select></td>
          </tr>

          <tr>
            <td class="form-label">特攻:</td>
            <td>
              <input type="number" id="stats_c" value="1" max="999" min="1" tabindex="6">
              <input type="button" data-target="stats_c" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="stats_c" data-val="-1" value="▼" class="num_ctrl">
            </td>
            <td class="form-label">努力値:</td>
            <td>
              <input type="number" id="effort_c" value="0" max="255" min="0" class="effort_input">
              <input type="button" data-target="effort_c" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="effort_c" data-val="-1" value="▼" class="num_ctrl">
              <input type="button" data-target="effort_c" data-val="0" value="0" class="num_input num_input_min">
              <input type="button" data-target="effort_c" data-val="252" value="252" class="num_input num_input_max">
            </td>
            <td class="form-label">ジャッジ:</td>
            <td><select id="judge_c"></select></td>
          </tr>

          <tr>
            <td class="form-label">特防:</td>
            <td>
              <input type="number" id="stats_d" value="1" max="999" min="1" tabindex="6">
              <input type="button" data-target="stats_d" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="stats_d" data-val="-1" value="▼" class="num_ctrl">
            </td>
            <td class="form-label">努力値:</td>
            <td>
              <input type="number" id="effort_d" value="0" max="255" min="0" class="effort_input">
              <input type="button" data-target="effort_d" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="effort_d" data-val="-1" value="▼" class="num_ctrl">
              <input type="button" data-target="effort_d" data-val="0" value="0" class="num_input num_input_min">
              <input type="button" data-target="effort_d" data-val="252" value="252" class="num_input num_input_max">
            </td>
            <td class="form-label">ジャッジ:</td>
            <td><select id="judge_d"></select></td>
          </tr>

          <tr>
            <td class="form-label">素早:</td>
            <td>
              <input type="number" id="stats_s" value="1" max="999" min="1" tabindex="6">
              <input type="button" data-target="stats_s" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="stats_s" data-val="-1" value="▼" class="num_ctrl">
            </td>
            <td class="form-label">努力値:</td>
            <td>
              <input type="number" id="effort_s" value="0" max="255" min="0" class="effort_input">
              <input type="button" data-target="effort_s" data-val="1" value="▲" class="num_ctrl">
              <input type="button" data-target="effort_s" data-val="-1" value="▼" class="num_ctrl">
              <input type="button" data-target="effort_s" data-val="0" value="0" class="num_input num_input_min">
              <input type="button" data-target="effort_s" data-val="252" value="252" class="num_input num_input_max">
            </td>
            <td class="form-label">ジャッジ:</td>
            <td><select id="judge_s"></select></td>
          </tr>
        </tbody>
      </table>
      <div class="calc-buttons">
        <input id="refine_button" type="button" value="絞り込み" class="calc">
        <input id="new_button" type="button" value="新しく結果を計算" class="calc">
      </div>
    </div>

    <div class="result-panel">
      <table class="result-table">
        <thead>
          <tr>
            <th>個体</th>
            <th>HP</th>
            <th>攻撃</th>
            <th>防御</th>
            <th>特攻</th>
            <th>特防</th>
            <th>素早</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
