<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>与えた定数ダメージと残りHPの%からステータスを特定するツール - つぬつーるず</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="wrapper">
    <div class="input-panel">
      <div class="header-controls">
        <div class="form-group">
          <div class="form-label">POKEMON</div>
          <select id="pokemonSelect" class="select-input"></select>
        </div>
        <div class="btn-group">
          <button id="btn-add" class="btn-add">+ 追加</button>
          <button id="btn-clear" class="btn-clear">全てリセット</button>
        </div>
      </div>
      <div id="setsList"></div>
    </div>

    <div class="result-panel">
      <table class="calc-table">
        <thead>
          <tr>
            <th style="width: 35px;">努力値</th>
            <th>最大HP</th>
            <th>残HP</th>
            <th>残HP%</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
